name: Basic CI Pipeline

on:
  push:
    branches:
      - mycibranch
jobs:
  build:
    runs-on: ubuntu-latest   # GitHub runner

    steps:
      # Step 1: Get code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install

      # Step 4: Run test
      - name: Run tests
        run: npm test

      # Step 5: Build app
      - name: Build app
        run: npm run build